<style>
.link-editor{border:1px solid var(--line);border-radius:18px;padding:12px 18px;margin-top:16px;background:var(--panel)}.link-editor summary{cursor:pointer;min-height:44px;padding:9px 0;color:var(--cyan);font-size:16px}.link-editor p{color:var(--muted);margin:9px 0;font-size:14px}.link-editor label{display:block;margin:15px 0 7px;font-size:16px}.link-editor select,.link-editor input{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--space);color:var(--ink);font-size:16px}.link-editor input:focus-visible,.link-editor select:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}.link-editor .editor-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.link-editor .editor-actions button{white-space:normal}.link-list{display:grid;gap:10px;margin-top:17px}.link-list button{padding:12px;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--space);font-size:16px}.link-list button span{display:block;color:var(--muted);font-size:14px;margin-top:5px}
</style>
<details class="link-editor"><summary>Editar vínculos de ejemplo</summary><p>Edición local y recuperable. No modifica fuentes ni una escena compartida real.</p><p id="edgeOrigin">Desde AudioSticker</p><label for="edgeTarget">Conectar con</label><select id="edgeTarget"></select><label for="edgeType">Tipo de vínculo</label><select id="edgeType"><option value="connection">Conexión interpretada</option><option value="possibility">Posibilidad</option><option value="tension">Tensión / diferencia</option></select><label for="edgeReason">¿Por qué se relacionan?</label><input id="edgeReason" maxlength="700" placeholder="Una razón que podamos revisar juntos"><div class="editor-actions"><button class="primary" id="edgeApply">Aplicar vínculo</button><button class="secondary" id="edgeRemove">Quitar vínculo</button><button class="plain" id="edgeUndo">Deshacer</button></div><div class="link-list" id="edgeList"></div><p id="edgeStatus" role="status">Grafo de ejemplo · versión local 1.</p></details>
<script>
(()=>{
const types={connection:'Conexión interpretada',possibility:'Posibilidad',tension:'Tensión / diferencia'},fields={},history=[];let revision=1;
const key=(a,b)=>[a,b].sort((x,y)=>x-y).join(':');links.forEach(([a,b])=>fields[key(a,b)]={type:'connection',reason:'Lectura de ejemplo.',author:'Design example'});
function snapshot(){history.push({links:links.map(e=>[...e]),fields:JSON.parse(JSON.stringify(fields))});if(history.length>100)history.shift()}
function load(){const target=+$('edgeTarget').value,field=fields[key(selected,target)];$('edgeType').value=field?.type||'connection';$('edgeReason').value=field?.reason||'';$('edgeRemove').disabled=!links.some(([a,b])=>key(a,b)===key(selected,target))}
function render(){const old=$('edgeTarget').value;$('edgeOrigin').textContent='Desde '+concepts[selected].name;$('edgeTarget').replaceChildren();concepts.forEach((c,i)=>{if(i===selected)return;const o=document.createElement('option');o.value=i;o.textContent=c.name;$('edgeTarget').append(o)});if(old&&+old!==selected)$('edgeTarget').value=old;load();$('edgeList').replaceChildren();for(const [a,b]of links){if(a!==selected&&b!==selected)continue;const n=a===selected?b:a,field=fields[key(a,b)];const button=document.createElement('button');button.textContent=concepts[n].name;const desc=document.createElement('span');desc.textContent=(types[field?.type]||types.connection)+' · '+(field?.reason||'Lectura de ejemplo.');button.append(desc);button.onclick=()=>{$('edgeTarget').value=n;load();$('edgeReason').focus()};$('edgeList').append(button)}$('edgeUndo').disabled=!history.length;window.matrixGraphExample={revision,edges:links.map(([a,b])=>({from:concepts[a].id,to:concepts[b].id,...fields[key(a,b)]})),simulation:true}}
function changed(label){revision++;choose(selected);$('edgeStatus').textContent=label+' · versión local '+revision+'.';notify(label+' en el ejemplo local. Exportá el recorrido para conservarlo.');render()}
$('edgeTarget').onchange=load;$('edgeApply').onclick=()=>{const target=+$('edgeTarget').value;if(target===selected||!concepts[target])return;snapshot();if(!links.some(([a,b])=>key(a,b)===key(selected,target)))links.push([selected,target]);fields[key(selected,target)]={type:$('edgeType').value,reason:$('edgeReason').value.trim(),author:'Local prototype visitor',status:'local interpretation'};changed('Vínculo aplicado')};$('edgeRemove').onclick=()=>{const target=+$('edgeTarget').value,i=links.findIndex(([a,b])=>key(a,b)===key(selected,target));if(i<0)return;snapshot();links.splice(i,1);delete fields[key(selected,target)];changed('Vínculo retirado; deshacer disponible')};$('edgeUndo').onclick=()=>{const old=history.pop();if(!old)return;links.splice(0,links.length,...old.links);Object.keys(fields).forEach(k=>delete fields[k]);Object.assign(fields,old.fields);changed('Versión anterior recuperada')};document.addEventListener('matrix:focus',render);render();
})();
</script>
